# ============================================================
# DevOps Lab 1 — CI/CD Pipeline với GitHub Actions
# Tự động deploy website lên GitHub Pages mỗi khi push code
# ============================================================

name: Deploy to GitHub Pages

# === Khi nào pipeline chạy? ===
on:
  push:
    branches: [main]       # CHỈ chạy khi push lên nhánh main
  workflow_dispatch:        # Cho phép chạy thủ công từ GitHub UI

# === Các job trong pipeline ===
jobs:
  # Job 1: Build & Deploy
  build-and-deploy:
    runs-on: ubuntu-latest   # Chạy trên máy ảo Ubuntu

    steps:
      # Step 1: Checkout code từ GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Kiểm tra HTML cơ bản
      - name: Validate HTML
        run: |
          echo "Checking index.html exists..."
          if [ -f "index.html" ]; then
            echo "index.html found!"
            echo "File size: $(wc -c < index.html) bytes"
          else
            echo "index.html NOT found!"
            exit 1
          fi

      # Step 3: Cài đặt Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Step 4: Chạy Lighthouse CI Audit
      - name: Run Lighthouse CI Audit
        run: |
          npm install -g @lhci/cli
          lhci autorun --collect.url="http://localhost:8080" || true

      # Step 5: Deploy lên GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          commit_message: "Auto-deploy from CI pipeline"